[project]
name = "rulguard"
version = "0.1.0"
description = "RULGuard: Bearing Health Monitoring and Remaining Useful Life Prediction (research prototype, not production)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
