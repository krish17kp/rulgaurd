[project]
name = "rulguard"
version = "0.1.0"
description = "RULGuard: Bearing Health Monitoring and Remaining Useful Life Prediction (research prototype, not production)."
requires-python = ">=3.11"
# Vercel's Python function build (`uv`, "Using Python 3.12 from pyproject.toml") installs
# from THIS list, not api/requirements.txt or the root requirements.txt - an empty/missing
# list here silently produced a venv with nothing installed, surfacing as
# "ModuleNotFoundError: No module named 'httpx'" in production. Mirrors api/requirements.txt
# exactly (the deployed FastAPI function's actual import set). Local dev installs this
# package editable with `pip install -e . --no-deps` (see rulgaurd-public/CLAUDE.md), which
# ignores this list entirely, so it has no effect on the full local requirements.txt install.
dependencies = [
    "fastapi",
    "pydantic",
    "python-multipart",
    "httpx",
    "joblib",
    "scikit-learn",
    "numpy",
    "pandas",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

# Pinned explicitly so `ruff check .` gives the same result across ruff versions.
# Without this, ruff's default rule set drifts between releases and the same
# unchanged code goes from clean to failing (observed: ruff 0.16.5 reported 33
# errors on code that was clean under the version used through M8).
#
# EXE002 ("file is executable but has no shebang") is deliberately not selected:
# this working tree lives on an NTFS/fuseblk mount that reports every file as
# mode 0755, so the rule fires on all 20 Python files regardless of content.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
