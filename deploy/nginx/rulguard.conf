# Host nginx for RULGuard. certbot --nginx adds the 443/TLS blocks and HTTP->HTTPS redirects.
# DOMAIN is substituted at install time (deploy/README.md).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Shared API proxy (FastAPI serves its routes under /api).
upstream rulguard_api { server 127.0.0.1:8000; keepalive 8; }

server {
    listen 80;
    server_name DOMAIN;
    root /opt/rulguard/site;
    client_max_body_size 70m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://rulguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name app.DOMAIN;
    client_max_body_size 70m;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://rulguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name lab.DOMAIN;
    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
