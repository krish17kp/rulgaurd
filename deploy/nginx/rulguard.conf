# Host nginx for RULGuard. certbot --nginx adds the 443/TLS blocks and HTTP->HTTPS redirects.
# DOMAIN is substituted at install time (deploy/README.md).
# One site: landing at /, API at /api/, every other path is the Next.js app.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Shared API proxy (FastAPI serves its routes under /api).
upstream rulguard_api { server 127.0.0.1:8000; keepalive 8; }

server {
    listen 80;
    server_name DOMAIN;
    root /opt/rulguard/site;
    client_max_body_size 70m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://rulguard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # The old Streamlit lab now lives in the Next.js app; keep its links working.
    location /lab { return 301 /results; }

    # Landing page (web/dist): its HTML at /, its hashed bundles under /assets/, its favicon.
    location = / { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; try_files /index.html =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }

    # Everything else is the Next.js analysis app (/upload, /trajectory, /evaluation, ...).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Old subdomains: keep links working, but land on the one site.
server {
    listen 80;
    server_name app.DOMAIN;
    return 301 https://DOMAIN$request_uri;
}

server {
    listen 80;
    server_name lab.DOMAIN;
    return 301 https://DOMAIN/results;
}
